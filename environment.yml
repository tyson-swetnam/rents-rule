# Conda environment for the rents-rule analysis stack.
#   conda env create -f environment.yml
#   conda activate rents-rule
# On CARC, load the site conda module first (e.g. `module load miniconda3`) and
# create the env under your project space, not $HOME, if quota is tight.
name: rents-rule
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - networkx>=3.0
  - pyyaml>=6
  - matplotlib>=3.7
  - pytest>=7
  - jupyterlab>=4
  - pip
  - pip:
      - -e .
