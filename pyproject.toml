[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rentscale"
version = "0.1.0"
description = "Rent's rule, self-similar traffic, and metabolic-scaling analysis for data center hierarchies (chip -> node -> rack -> pod -> facility)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tyson L. Swetnam", email = "tswetnam@unm.edu" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "networkx>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
plot = ["matplotlib>=3.7"]
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.7"]

[project.scripts]
rentscale = "rentscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long lines are tolerated in tables and CLI help strings
# stdlib-only scripts that must run on Python 3.6 nodes: keep %-formatting, universal_newlines, no walrus
per-file-ignores = { "telemetry/collectors/*.py" = ["UP", "B"], "benchmarks/inference/*.py" = ["UP", "B"] }
